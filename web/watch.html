<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=17">
<style>
.comments{margin-top:8px}
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #23232e}
.comment .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:14px}
.comment .cb b{font-size:13px}
.comment .cb small{color:var(--muted);margin-left:6px;font-size:11px}
.comment .cb p{margin:4px 0 0;font-size:14px;line-height:1.45}
.comment.reply{margin-left:44px;border-bottom:1px solid #1b1b26}
.comment.reply .av{width:28px;height:28px;font-size:12px}
.cacts{display:flex;gap:14px;margin-top:6px}
.cacts button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 0;font-weight:600}
.cacts button:hover{color:var(--text)}
.rform{display:flex;gap:8px;margin-top:8px}
.rform input{flex:1;background:var(--bg2);border:1px solid #2a2a38;color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px}
.rform .btn{padding:7px 14px;font-size:13px}
.cform{display:flex;gap:8px;margin:12px 0}
.cform input{flex:1;background:var(--bg2);border:1px solid #2a2a38;color:var(--text);border-radius:999px;padding:10px 16px;font-size:14px}
.watch-layout{display:block}
@media (min-width:1000px){
  .watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
  .watch-side .side-grid{grid-template-columns:1fr;gap:14px;padding-top:4px}
}
body.theater .wrap{max-width:1500px}
body.theater .watch-layout{grid-template-columns:1fr}
body.theater .watch-side{display:none}
#likeBtn.liked-pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18)}}
</style>
</head>
<body>
<header class="top"></header>
<div class="wrap" id="content"></div>
<script src="js/config.js?v=17"></script>
<script src="js/app.js?v=17"></script>
<script src="js/ads.js?v=17"></script>
<script>
renderHeader("");
renderFooter();
const id = new URLSearchParams(location.search).get("v");
const content = $("#content");
const logged = !!localStorage.getItem("token");

if (!id) { showEmpty(content, "🎬", "No video selected", "Pick a video from the homepage."); }
else load();

async function load() {
  content.innerHTML = '<div class="thumb skel" style="margin-top:14px"></div>';
  let v;
  const at = new URLSearchParams(location.search).get("at");
  const atQ = at ? ("&at=" + encodeURIComponent(at)) : "";
  try { v = await api("/api/videos/" + id + atQ); }
  catch (e) { showEmpty(content, "⚠️", "Video not available", e.message); return; }

  const resumeKey = "pos_" + v.id;
  let resume = v.resume_position || 0;
  if (!logged) resume = parseInt(localStorage.getItem(resumeKey) || "0", 10) || 0;

  content.innerHTML = `
    <div class="watch-layout"><div class="watch-main">
    <div class="player-shell"><div class="player-wrap">
      <video class="player" id="player" controls playsinline preload="metadata"
             ${v.thumb_url ? `poster="${esc(v.thumb_url)}"` : ""}>
        <source src="${esc(v.stream_url + atQ)}" type="video/mp4">
        Sorry, your browser cannot play this video.
      </video>
    </div></div>
    <h1 class="watch-title">${esc(v.title)}</h1>
    <div class="watch-meta">${fmtViews(v.view_count)} · ${timeAgo(v.published_at)}${v.file_size ? " · " + fmtSize(v.file_size) : ""}</div>
    <div class="actions">
      <button class="btn" id="likeBtn"><svg class="ic-s" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.2-8a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h3"/></svg><span id="likeLabel">${v.liked ? "Liked" : "Like"}</span> · <span id="likeCount">${v.like_count}</span></button>
      <button class="btn" id="plBtn"><svg class="ic-s" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Save</button>
      <button class="btn" id="shareBtn"><svg class="ic-s" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg>Share</button>
      <button class="btn" id="reportBtn"><svg class="ic-s" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>Report</button>
      <button class="btn" id="speedBtn" title="Playback speed"><svg viewBox="0 0 24 24"><path d="M13 19l9-7-9-7v14zM2 19l9-7-9-7v14z"/></svg><span id="speedLabel">1x</span></button>
      <button class="btn" id="theaterBtn" title="Theater mode"><svg class="ic-s" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>Theater</button>
      <button class="btn speed-btn" id="autoBtn" title="Autoplay next video"><svg viewBox="0 0 24 24"><path d="M6 4.5v15l13-7.5z"/></svg><span id="autoLabel">Autoplay: Off</span></button>
    </div>
    <div class="adslot" data-ad="watch_top"></div>
    ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ""}
    <div class="section-title">Comments (<span id="ccount">${v.comment_count || 0}</span>)</div>
    <div class="comments">
      <div class="cform" id="cform" style="${logged ? "" : "display:none"}">
        <input id="cinput" placeholder="Add a comment…" maxlength="1000">
        <button class="btn primary" id="cpost">Post</button>
      </div>
      ${logged ? "" : `<p style="color:var(--muted);font-size:13px"><a href="library.html" style="color:var(--accent)">Sign in</a> to comment.</p>`}
      <div id="clist"></div>
    </div>
    <div class="adslot" data-ad="watch_mid"></div>
    </div>
    <aside class="watch-side">
      <div class="section-title" style="margin-top:16px">Related</div>
      <div class="grid side-grid" id="related"></div>
    </aside>
    </div>`;

  const player = $("#player");
  const rel = $("#related");
  (v.related || []).forEach(r => rel.appendChild(videoCard(r)));
  if (!v.related || !v.related.length) rel.innerHTML = '<p style="color:var(--muted)">No related videos.</p>';
  renderAds(content);

  // resume where left off
  if (resume > 10) {
    player.addEventListener("loadedmetadata", () => {
      if (resume < player.duration - 15) player.currentTime = resume;
    }, { once: true });
  }

  // register a view on first play
  let viewed = false;
  player.addEventListener("play", () => {
    if (!viewed) { viewed = true; api(`/api/videos/${v.id}/view`, { method: "POST" }).catch(() => {}); }
  });

  // save position periodically + on pause
  const savePos = () => {
    const pos = Math.floor(player.currentTime || 0);
    if (pos < 5) return;
    if (logged) api("/api/history", { method: "POST", body: JSON.stringify({ video_id: v.id, position: pos }) }).catch(() => {});
    else localStorage.setItem(resumeKey, String(pos));
  };
  setInterval(() => { if (!player.paused) savePos(); }, 15000);
  player.addEventListener("pause", savePos);
  window.addEventListener("pagehide", savePos);

  // clear saved position when finished
  player.addEventListener("ended", () => {
    if (logged) api("/api/history", { method: "POST", body: JSON.stringify({ video_id: v.id, position: 0 }) }).catch(() => {});
    else localStorage.removeItem(resumeKey);
    if (localStorage.getItem("autoplay_next") === "1" && v.related && v.related.length) {
      showToast("Playing next: " + v.related[0].title);
      setTimeout(() => { location.href = "watch.html?v=" + v.related[0].id; }, 1200);
    }
  });

  // playback speed + autoplay toggle + keyboard shortcuts
  const speeds = [1, 1.25, 1.5, 2, 0.5];
  let sIdx = 0;
  $("#speedBtn").onclick = () => {
    sIdx = (sIdx + 1) % speeds.length;
    player.playbackRate = speeds[sIdx];
    $("#speedLabel").textContent = speeds[sIdx] + "x";
    showToast("Speed: " + speeds[sIdx] + "x");
  };
  const autoBtn = $("#autoBtn");
  const paintAuto = () => {
    const on = localStorage.getItem("autoplay_next") === "1";
    $("#autoLabel").textContent = "Autoplay: " + (on ? "On" : "Off");
    autoBtn.classList.toggle("on", on);
  };
  paintAuto();
  autoBtn.onclick = () => {
    localStorage.setItem("autoplay_next", localStorage.getItem("autoplay_next") === "1" ? "0" : "1");
    paintAuto();
  };
  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); player.paused ? player.play() : player.pause(); }
    else if (e.key === "ArrowRight" || e.key === "l") player.currentTime = Math.min(player.duration || 1e9, player.currentTime + 10);
    else if (e.key === "ArrowLeft" || e.key === "j") player.currentTime = Math.max(0, player.currentTime - 10);
    else if (e.key === "f") { if (document.fullscreenElement) document.exitFullscreen(); else player.requestFullscreen && player.requestFullscreen(); }
    else if (e.key === "m") player.muted = !player.muted;
  });

  // comments (threaded, with replies)
  function commentNode(c, isReply) {
    const div = document.createElement("div");
    div.className = "comment" + (isReply ? " reply" : "");
    div.innerHTML = `<div class="av">${esc((c.user_name || "?")[0].toUpperCase())}</div>
      <div class="cb"><b>${esc(c.user_name)}</b><small>${timeAgo(c.created_at)}</small><p>${esc(c.body)}</p>
      <div class="cacts">
        ${logged && !isReply ? `<button data-reply="${c.id}">↩ Reply</button>` : ""}
        ${logged && !c.mine ? `<button data-report="${c.id}">🚩 Report</button>` : ""}
        ${c.mine ? `<button data-del="${c.id}">🗑 Delete</button>` : ""}
      </div>
      <div class="rform" id="rf_${c.id}" style="display:none">
        <input placeholder="Write a reply…" maxlength="1000">
        <button class="btn primary" data-send="${c.id}">Reply</button>
      </div></div>`;
    return div;
  }
  async function loadComments() {
    const cl = $("#clist");
    try {
      const d = await api(`/api/videos/${v.id}/comments?per_page=30`);
      $("#ccount").textContent = d.total;
      cl.innerHTML = d.items.length ? "" : '<p style="color:var(--muted);font-size:13px">No comments yet. Be the first!</p>';
      d.items.forEach(c => {
        cl.appendChild(commentNode(c, false));
        (c.replies || []).forEach(r => cl.appendChild(commentNode(r, true)));
      });
      cl.querySelectorAll("[data-reply]").forEach(b => b.onclick = () => {
        const f = $("#rf_" + b.dataset.reply);
        f.style.display = f.style.display === "none" ? "flex" : "none";
        const inp = f.querySelector("input"); if (inp) inp.focus();
      });
      cl.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
        const f = $("#rf_" + b.dataset.send), inp = f.querySelector("input");
        const body = inp.value.trim(); if (!body) return;
        b.disabled = true;
        try { await api(`/api/videos/${v.id}/comments`, { method: "POST", body: JSON.stringify({ body, parent_id: +b.dataset.send }) }); loadComments(); }
        catch (e) { alert(e.message); }
        b.disabled = false;
      });
      cl.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
        if (!confirm("Delete this comment?")) return;
        try { await api("/api/comments/" + b.dataset.del, { method: "DELETE" }); loadComments(); }
        catch (e) { alert(e.message); }
      });
      cl.querySelectorAll("[data-report]").forEach(b => b.onclick = async () => {
        const reason = prompt("Why are you reporting this comment? (optional)") ;
        if (reason === null) return;
        try { await api("/api/reports", { method: "POST", body: JSON.stringify({ comment_id: +b.dataset.report, reason }) }); alert("Reported. Thank you."); }
        catch (e) { alert(e.message); }
      });
    } catch (e) { cl.innerHTML = ""; }
  }
  loadComments();
  const cp = $("#cpost");
  if (cp) cp.onclick = async () => {
    const inp = $("#cinput"), body = inp.value.trim();
    if (!body) return;
    cp.disabled = true;
    try { await api(`/api/videos/${v.id}/comments`, { method: "POST", body: JSON.stringify({ body }) }); inp.value = ""; loadComments(); }
    catch (e) { alert(e.message); }
    cp.disabled = false;
  };

  // like
  $("#likeBtn").onclick = async () => {
    if (!logged) { location.href = "library.html"; return; }
    try {
      const r = await api(`/api/videos/${v.id}/like`, { method: "POST" });
      $("#likeLabel").textContent = r.liked ? "Liked" : "Like";
      $("#likeCount").textContent = r.like_count;
      if (r.liked) { const b = $("#likeBtn"); b.classList.remove("liked-pop"); void b.offsetWidth; b.classList.add("liked-pop"); showToast("Added to your liked videos"); }
    } catch (e) { alert(e.message); }
  };

  // share
  $("#shareBtn").onclick = async () => {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: v.title, url }); return; } catch (e) { /* cancelled */ return; }
    }
    try { await navigator.clipboard.writeText(url); showToast("Link copied to clipboard"); }
    catch (e) { prompt("Copy this link:", url); }
  };
  $("#theaterBtn").onclick = () => {
    document.body.classList.toggle("theater");
    showToast(document.body.classList.contains("theater") ? "Theater mode on" : "Theater mode off");
  };
  // save to playlist
  $("#plBtn").onclick = async () => {
    if (!logged) { location.href = "library.html"; return; }
    try {
      const pls = await api("/api/playlists");
      let name = prompt(
        pls.length ? "Save to playlist (type name or pick):\n" + pls.map(p => "• " + p.title).join("\n") + "\n\nOr type a NEW name:"
                    : "Create a playlist to save this video:");
      if (!name) return;
      let pl = pls.find(p => p.title.toLowerCase() === name.toLowerCase());
      if (!pl) pl = await api("/api/playlists", { method: "POST", body: JSON.stringify({ title: name }) });
      await api(`/api/playlists/${pl.id}/items`, { method: "POST", body: JSON.stringify({ video_id: v.id }) });
      alert("Saved to " + pl.title);
    } catch (e) { alert(e.message); }
  };
}
</script>
</body>
</html>
