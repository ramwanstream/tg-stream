<!DOCTYPE html>
<html lang="en">
<head>
<meta name="6a97888e-site-verification" content="99792ddd9771f8982eb004c66cb09e3e">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12119804' data-sdk='show_12119804'></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=21">
<style>
.hero{position:relative;border-radius:16px;overflow:hidden;margin:14px 0 6px;min-height:200px;background:var(--card);display:block;color:inherit;text-decoration:none}
.hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.85))}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:18px}
.hero .kicker{font-size:11px;letter-spacing:2.5px;color:#ff6b62;text-transform:uppercase;font-weight:700}
.hero h2{margin:6px 0;font-size:20px;overflow-wrap:anywhere;word-break:break-word}
.hero .meta{font-size:12px;color:#c9c9d4}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.hero-slide.on{opacity:1;pointer-events:auto}
.hero-slide img{animation:kenburns 7s ease both}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero-dots{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:3}
.hero-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
.hero-dots i.on{background:#fff;width:20px;border-radius:99px}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.row-scroll .card{min-width:250px;max-width:250px;scroll-snap-align:start}
.spinner{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sorttabs{display:flex;gap:8px;margin:12px 0 0}
.sorttab{border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:999px;padding:0 16px;height:36px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.sorttab.active{background:#fff;border-color:#fff;color:#0b0b0c}
[data-theme="light"] .sorttab.active{background:#0f0f10;border-color:#0f0f10;color:#fff}
</style>
</head>
<body>
<header class="top"></header>
<div class="wrap">
  <div class="adslot" data-ad="home_top"></div>
  <div id="hero"></div>
  <div class="section-title" id="cwTitle" style="display:none">Continue watching</div>
  <div class="row-scroll" id="cwRow" style="display:none"></div>
  <div class="section-title" id="featTitle" style="display:none">Featured</div>
  <div class="row-scroll" id="featRow" style="display:none"></div>
  <div class="section-title" id="trendTitle" style="display:none">Trending this week</div>
  <div class="row-scroll" id="trendRow" style="display:none"></div>
  <div class="sorttabs" id="sorttabs">
    <button class="sorttab active" data-s="new">Latest</button>
    <button class="sorttab" data-s="popular">Most viewed</button>
    <button class="sorttab" data-s="trending">Trending</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div id="feedSpin" style="display:none;text-align:center;padding:22px 0 6px"><span class="spinner"></span></div>
  <p id="feedEnd" style="display:none;text-align:center;color:var(--muted);font-size:13px;padding:14px 0 4px">You're all caught up ✓</p>
  <div id="feedSentinel" style="height:4px"></div>
</div>
<script src="js/config.js?v=21"></script>
<script src="js/app.js?v=21"></script>
<script src="js/ads.js?v=21"></script>
<script src="js/tma-ads.js?v=21"></script>
<script>
renderHeader("home");
renderFooter();
renderAds();
const params = new URLSearchParams(location.search);
let q = params.get("q") || "";
let category = "all";
let sort = "new";
let page = 1;
let feedLoading = false, feedHasMore = true;
const grid = $("#grid");

function renderHero(v) { renderHeroCarousel(v ? [v] : []); }

let heroTimer = null;
function renderHeroCarousel(items) {
  const hero = $("#hero");
  if (!items.length) { hero.innerHTML = ""; return; }
  hero.innerHTML = `
    <div class="hero" id="heroBox">
      ${items.map((v, i) => `
      <a class="hero-slide${i === 0 ? " on" : ""}" href="watch.html?v=${v.id}">
        ${v.thumb_url ? `<img src="${esc(v.thumb_url)}" alt="" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" onerror="this.remove()">` : ""}
        <div class="grad"></div>
        <div class="txt">
          <div class="kicker">Featured</div>
          <h2>${esc(v.title)}</h2>
          <div class="meta">${fmtViews(v.view_count)} · ${timeAgo(v.published_at)}${v.duration ? " · " + fmtDur(v.duration) : ""}</div>
        </div>
      </a>`).join("")}
      ${items.length > 1 ? `<div class="hero-dots">${items.map((_, i) => `<i data-h="${i}" class="${i === 0 ? "on" : ""}"></i>`).join("")}</div>` : ""}
    </div>`;
  if (items.length < 2) return;
  const slides = hero.querySelectorAll(".hero-slide"), dots = hero.querySelectorAll(".hero-dots i");
  let cur = 0;
  const go = n => {
    slides[cur].classList.remove("on"); dots[cur].classList.remove("on");
    cur = (n + items.length) % items.length;
    slides[cur].classList.add("on"); dots[cur].classList.add("on");
  };
  dots.forEach(d => d.onclick = e => { e.preventDefault(); go(+d.dataset.h); restart(); });
  const restart = () => { clearInterval(heroTimer); heroTimer = setInterval(() => go(cur + 1), 6000); };
  restart();
  $("#heroBox").addEventListener("pointerdown", () => clearInterval(heroTimer));
}

async function loadContinue() {
  if (!localStorage.getItem("token")) return;
  const row = $("#cwRow"), title = $("#cwTitle");
  try {
    const items = await api("/api/history");
    const cont = (items || []).filter(v => v.resume_position > 10 && v.duration && v.resume_position < v.duration - 15);
    if (!cont.length) return;
    cont.slice(0, 12).forEach(v => row.appendChild(videoCard(v)));
    row.style.display = ""; title.style.display = "";
  } catch (e) {}
}

async function loadFeatured() {
  const row = $("#featRow"), title = $("#featTitle");
  if (q || category !== "all") { row.style.display = "none"; title.style.display = "none"; return; }
  try {
    const d = await api("/api/videos?featured=1&per_page=12");
    if (!d.items.length) { row.style.display = "none"; title.style.display = "none"; return; }
    row.innerHTML = "";
    d.items.forEach(v => row.appendChild(videoCard(v)));
    row.style.display = ""; title.style.display = "";
    // featured videos rotate in the hero carousel
    renderHeroCarousel(d.items.slice(0, 5));
  } catch (e) {}
}

async function loadTrending() {
  const row = $("#trendRow"), title = $("#trendTitle");
  if (q || category !== "all") { row.style.display = "none"; title.style.display = "none"; return; }
  title.style.display = ""; row.style.display = "";
  row.innerHTML = Array(4).fill('<div class="card" style="min-width:250px;max-width:250px"><div class="thumb skel"></div><div class="skel" style="height:14px;margin-top:8px"></div></div>').join("");
  try {
    const d = await api("/api/videos?sort=trending&per_page=8");
    if (!d.items.length) { row.style.display = "none"; title.style.display = "none"; return; }
    row.innerHTML = "";
    d.items.forEach(v => row.appendChild(videoCard(v)));
  } catch (e) { row.style.display = "none"; title.style.display = "none"; }
}

async function loadCats() {
  try {
    const cats = await api("/api/categories");
    const chips = $("#chips");
    chips.innerHTML = "";
    const all = document.createElement("button");
    all.className = "chip" + (category === "all" ? " active" : "");
    all.textContent = "All";
    all.onclick = () => { category = "all"; reset(); };
    chips.appendChild(all);
    cats.filter(c => c.count > 0).forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (category === c.slug ? " active" : "");
      b.textContent = c.name;
      b.onclick = () => { category = c.slug; reset(); };
      chips.appendChild(b);
    });
  } catch (e) { /* categories optional */ }
}

function reset() { page = 1; feedHasMore = true; grid.innerHTML = ""; $("#hero").innerHTML = ""; $("#feedEnd").style.display = "none"; load(); loadCats(); }

$$("#sorttabs .sorttab").forEach(b => b.onclick = () => {
  $$("#sorttabs .sorttab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  sort = b.dataset.s; reset();
});

async function load() {
  if (feedLoading) return;
  feedLoading = true;
  $("#feedSpin").style.display = page > 1 ? "block" : "none";
  const showHero = (page === 1 && sort === "new" && !q && category === "all");
  if (page === 1) {
    grid.innerHTML = Array(6).fill('<div><div class="thumb skel"></div><div class="skel" style="height:14px;margin-top:8px"></div><div class="skel" style="height:12px;width:60%;margin-top:6px"></div></div>').join("");
    if (showHero) $("#hero").innerHTML = `<div class="skel" style="min-height:200px;margin:14px 0 6px"></div>`;
  }
  try {
    const qs = new URLSearchParams({ page, per_page: 24, sort });
    if (q) qs.set("q", q);
    if (category !== "all") qs.set("category", category);
    const data = await api("/api/videos?" + qs);
    if (page === 1) {
      grid.innerHTML = "";
      // hero reuses the first video — no extra API call
      renderHero(showHero ? data.items[0] : null);
    }
    if (!data.items.length && page === 1) {
      showEmpty(grid, "🎬", q ? "No results" : "No videos yet",
        q ? `Nothing found for "${q}".` : "Videos from the channel will appear here automatically.");
      return;
    }
    feedHasMore = data.total > page * data.per_page;
    if (!feedHasMore && page > 1) $("#feedEnd").style.display = "block";
    data.items.forEach((v, i) => {
      grid.appendChild(videoCard(v));
      // in-feed native ad after every 6th video
      if ((i + 1) % 6 === 0) {
        const ad = document.createElement("div");
        ad.className = "adslot"; ad.dataset.ad = "home_feed";
        ad.style.gridColumn = "1 / -1";
        grid.appendChild(ad);
      }
    });
    renderAds(grid);
  } catch (e) {
    if (page === 1) { showEmpty(grid, "⚠️", "Could not load videos", e.message); renderHero(null); }
  } finally {
    feedLoading = false;
    $("#feedSpin").style.display = "none";
  }
}
// infinite scroll: next page loads automatically as the user reaches the bottom
const feedObserver = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && feedHasMore && !feedLoading) { page++; load(); }
}, { rootMargin: "700px 0px" });
feedObserver.observe($("#feedSentinel"));
loadCats(); load(); loadTrending(); loadFeatured(); loadContinue();
</script>
</body>
</html>
