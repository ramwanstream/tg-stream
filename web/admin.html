<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · StreamHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=18">
<style>
.shell{display:flex;gap:18px;align-items:flex-start}
.side{width:210px;flex-shrink:0;position:sticky;top:76px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px 10px;backdrop-filter:blur(14px)}
.side-logo{font-weight:800;font-size:15px;padding:4px 10px 12px;color:var(--text)}
.stab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;margin:2px 0}
.stab .si{font-size:16px}
.stab:hover{background:rgba(255,255,255,.05)}
.stab.active{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(255,61,71,.25)}
.side-link{display:block;margin-top:12px;padding:9px 12px;border-radius:12px;color:var(--muted);font-size:13px;text-decoration:none;border:1px dashed rgba(255,255,255,.14)}
.side-link:hover{color:var(--text)}
.main{flex:1;min-width:0}
@media (max-width:760px){
  .shell{flex-direction:column}
  .side{width:100%;position:static;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .side-logo{width:100%;padding-bottom:6px}
  .stab{width:auto;padding:8px 10px;font-size:13px}
  .side-link{margin-top:4px}
}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px}
.stat b{font-size:22px;display:block;background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--muted)}
.chart{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
.chart svg{width:100%;height:120px;display:block}
.chart .cap{font-size:12px;color:var(--muted);margin-top:6px}
.panel{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
.panel h3{margin:0 0 10px;font-size:15px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #23232e;gap:8px}
.kv:last-child{border-bottom:0}
.kv small{color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid #2a2a38;white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid #23232e;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.thumb-sm{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#1a1a24;flex-shrink:0}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:10px;background:var(--bg2);border-radius:10px;font-size:13px}
select,input[type=text],input[type=search],input[type=password],input[type=number]{background:var(--bg2);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:0 12px;height:42px;font-size:14px}
.btn.sm{padding:6px 12px;font-size:12px}
/* v13 readability */
body{font-size:15px}
table.tbl{font-size:14.5px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#b9b9c2}
.tbl td{padding:10px 8px}
.tbl td small{font-size:12.5px !important;color:#d3d3da !important}
#vlist{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vtitle{font-size:15px;font-weight:700;line-height:1.35}
.vmeta{font-size:12.5px;color:#d3d3da;margin-top:3px}
.dchip{display:inline-block;background:#000;border:1px solid var(--border);color:#fff;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.num{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--text);font-size:24px}
.stat span{font-size:12.5px;color:#c9c9d1}
.kv{font-size:14px}
select,input[type=text],input[type=search]{font-size:14px}
.pill{font-size:12px;padding:4px 11px}
.btn.sm{font-size:12.5px;padding:7px 13px}
.vtbl{table-layout:fixed}
.vtbl .vtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtbl td{padding:10px 6px}
.btn.sm.ic{padding:7px 9px}
.pill{font-size:11px;padding:3px 10px;border-radius:999px;background:#2a2a38;white-space:nowrap}
.pill.pub{background:#123f2a;color:#4ade80}
.pill.unpub{background:#3f2a12;color:#fbbf24}
</style>
</head>
<body>
<header class="top"></header>
<div class="wrap" id="content"></div>
<dialog id="statsDlg" style="width:min(560px,94vw)"></dialog>
<dialog id="editDlg">
  <h3 style="margin-top:0">Edit video</h3>
  <div class="field"><label>Title</label><input id="eTitle"></div>
  <div class="field"><label>Description</label><textarea id="eDesc" rows="4"></textarea></div>
  <div class="field"><label>Category</label><input id="eCat" placeholder="e.g. Travel"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="btn" id="eCancel">Cancel</button>
    <button class="btn primary" id="eSave">Save</button>
  </div>
</dialog>
<script src="js/config.js?v=18"></script>
<script src="js/app.js?v=18"></script>
<script>
renderHeader("");
renderFooter();
const content = $("#content");
let token = sessionStorage.getItem("admin_token") || "";
let tab = "dash";

if (!token) {
  content.innerHTML = `
    <div class="form-card">
      <h2>Admin login</h2>
      <p style="color:var(--muted);font-size:13px">Enter the admin token from the server
      (the <code>ADMIN_TOKEN</code> shown when the backend first started).</p>
      <div class="field"><label>Admin token</label><input id="aToken" type="password"></div>
      <div class="error" id="aErr"></div>
      <button class="btn primary" id="aGo" style="width:100%;justify-content:center">Open admin</button>
    </div>`;
  $("#aGo").onclick = async () => {
    token = $("#aToken").value.trim();
    try { await aapi("/api/admin/status"); sessionStorage.setItem("admin_token", token); boot(); }
    catch (e) { $("#aErr").textContent = "Wrong token."; token = ""; }
  };
} else boot();

async function aapi(path, opts = {}) {
  const headers = { "Content-Type": "application/json", "X-Admin-Token": token, ...((opts.headers) || {}) };
  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && (data.detail || data.message)) || `Failed (${res.status})`);
  return data;
}

function tabs() {
  const t = [["dash","📊","Dashboard"],["review","📥","Review"],["reports","🚩","Reports"],["videos","🎬","Videos"],["cats","🗂️","Categories"],["comments","💬","Comments"],["users","👥","Users"],["settings","🎛️","Settings"],["activity","🛡️","Activity"],["system","🖥️","System"],["setup","⚙️","Setup"]];
  return `<aside class="side">
    <div class="side-logo">Super Admin</div>
    ${t.map(([k,i,l]) => `<button class="stab${tab===k?" active":""}" data-tab="${k}"><span class="si">${i}</span>${l}</button>`).join("")}
    <a class="side-link" href="index.html">🌐 View site</a>
  </aside>`;
}
function bindTabs() {
  content.querySelectorAll(".stab").forEach(b => b.onclick = () => { tab = b.dataset.tab; boot(); });
}

async function boot() {
  content.innerHTML = `<div class="shell">${tabs()}<div id="pane" class="main"></div></div>`;
  bindTabs();
  const pane = $("#pane");
  if (tab === "dash") return paneDash(pane);
  if (tab === "videos") return paneVideos(pane);
  if (tab === "review") return paneReview(pane);
  if (tab === "reports") return paneReports(pane);
  if (tab === "comments") return paneComments(pane);
  if (tab === "users") return paneUsers(pane);
  if (tab === "settings") return paneSettings(pane);
  if (tab === "activity") return paneActivity(pane);
  if (tab === "cats") return paneCats(pane);
  if (tab === "system") return paneSystem(pane);
  return paneSetup(pane);
}

/* ---------------- Dashboard ---------------- */
function barChart(days) {
  const W = 560, H = 120, max = Math.max(1, ...days.map(d => d.views));
  const bw = W / days.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  days.forEach((d, i) => {
    const h = Math.max(2, (d.views / max) * (H - 24));
    const x = i * bw + 2, y = H - h;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#ff3d47" opacity="${d.views ? 0.9 : 0.25}"><title>${d.day}: ${d.views} views</title></rect>`;
  });
  return s + "</svg>";
}

async function paneDash(pane) {
  pane.innerHTML = "<p>Loading…</p>";
  let st;
  try { st = await aapi("/api/admin/stats"); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  const t = st.totals;
  let sys = null;
  try { sys = await aapi("/api/admin/system"); } catch (e) {}
  const alerts = sys ? `
    ${sys.pending_review ? `<div class="panel" style="border-color:#f59e0b"><b>📥 ${sys.pending_review} upload(s)</b> waiting in Review — <a href="#" data-go="review" style="color:var(--accent)">open Review</a></div>` : ""}
    ${sys.open_reports ? `<div class="panel" style="border-color:#ef4444"><b>🚩 ${sys.open_reports} open report(s)</b> — <a href="#" data-go="reports" style="color:var(--accent)">open Reports</a></div>` : ""}` : "";
  pane.innerHTML = alerts + `
    <div class="stat-grid">
      <div class="stat"><b>${t.videos}</b><span>🎬 Videos</span></div>
      <div class="stat"><b>${fmtViews(t.views)}</b><span>👁️ Total views</span></div>
      <div class="stat"><b>${t.likes}</b><span>❤️ Likes</span></div>
      <div class="stat"><b>${t.comments}</b><span>💬 Comments</span></div>
      <div class="stat"><b>${t.users}</b><span>👥 Users</span></div>
      <div class="stat"><b>${t.published}/${t.videos}</b><span>📢 Published</span></div>
    </div>
    <div class="chart"><h3 style="margin:0 0 8px;font-size:15px">Views — last 14 days</h3>
      ${barChart(st.views_by_day)}
      <div class="cap">${st.views_by_day[0].day} → ${st.views_by_day[13].day}</div></div>
    <div class="panel"><h3>🔥 Top videos</h3>
      ${st.top_videos.map(v => `<div class="kv"><span>${v.thumb_url ? `<img src="${esc(v.thumb_url)}" class="thumb-sm" style="width:72px;vertical-align:middle;margin-right:8px">` : ""}${esc(v.title)}</span><b>${fmtViews(v.view_count)}</b></div>`).join("") || "<small>No videos yet.</small>"}
    </div>
    <div class="panel"><h3>💬 Latest comments</h3>
      ${st.recent_comments.map(c => `<div class="kv"><span><b>${esc(c.user_name)}</b> on ${esc(c.video_title)}<br><small>${esc(c.body)}</small></span><small>${esc((c.created_at||"").slice(0,16).replace("T"," "))}</small></div>`).join("") || "<small>No comments yet.</small>"}
    </div>
    ${sys ? `<div class="chart"><h3 style="margin:0 0 8px;font-size:15px">New signups — last 14 days</h3>
      <div style="display:flex;gap:3px;align-items:flex-end;height:90px">${(() => { const mx = Math.max(1, ...sys.signups_by_day.map(d => d.signups)); return sys.signups_by_day.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px" title="${d.day}: ${d.signups}"><div style="width:100%;max-width:24px;height:${Math.max(3, Math.round(d.signups / mx * 64))}px;background:var(--accent);border-radius:4px"></div><small style="font-size:9px;color:var(--muted)">${d.day.slice(5)}</small></div>`).join(""); })()}</div></div>` : ""}
    <div class="panel"><h3>👥 Newest users</h3>
      ${st.recent_users.map(u => `<div class="kv"><span>${esc(u.name)}<br><small>${esc(u.email)}</small></span><small>${esc((u.created_at||"").slice(0,10))}</small></div>`).join("") || "<small>No users yet.</small>"}
    </div>`;
  pane.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); tab = a.dataset.go; boot(); });
}

/* ---------------- Reports ---------------- */
async function paneReports(pane) {
  pane.innerHTML = "<p>Loading…</p>";
  let d;
  try { d = await aapi("/api/admin/reports"); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  pane.innerHTML = `<div class="panel"><h3>🚩 Open reports (${d.items.length})</h3>
    ${d.items.length ? "" : '<p style="color:var(--muted)">No open reports. 🎉</p>'}
    ${d.items.map(r => `<div class="admin-row">
      <div style="font-size:20px">${r.comment_id ? "💬" : "🎬"}</div>
      <div class="grow"><b>${esc(r.comment_id ? "Comment on: " + (r.video_title || "") : (r.video_title || "Video"))}</b>
        ${r.comment_body ? `<br><small>“${esc(r.comment_body.slice(0, 120))}”</small>` : ""}
        <br><small>reported by ${esc(r.reporter || "?")} · ${esc((r.created_at || "").slice(0, 16))}${r.reason ? " · reason: " + esc(r.reason) : ""}</small></div>
      <div class="row-actions">
        ${r.video_id ? `<a class="btn" href="watch.html?v=${r.video_id}" target="_blank">View</a>` : ""}
        ${r.comment_id ? `<button class="btn danger" data-delc="${r.comment_id}">Delete comment</button>` : ""}
        <button class="btn" data-dismiss="${r.id}">Dismiss</button>
      </div></div>`).join("")}
    </div>`;
  pane.querySelectorAll("[data-dismiss]").forEach(b => b.onclick = async () => {
    await aapi("/api/admin/reports/" + b.dataset.dismiss, { method: "PATCH", body: JSON.stringify({ status: "dismissed" }) });
    paneReports(pane);
  });
  pane.querySelectorAll("[data-delc]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this comment?")) return;
    await aapi("/api/admin/comments/" + b.dataset.delc, { method: "DELETE" });
    paneReports(pane);
  });
}

/* ---------------- Review (user upload moderation) ---------------- */
async function paneReview(pane) {
  pane.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
  try {
    const d = await aapi("/api/admin/uploads");
    let html = `<div class="section-title">⏳ Awaiting review (${d.queue.length})</div>`;
    if (!d.queue.length) html += '<p style="color:var(--muted)">No uploads waiting.</p>';
    d.queue.forEach(v => {
      html += `<div class="admin-row">
        <div class="grow"><b>${esc(v.title)}</b>
        <small>by ${esc(v.uploader)} (${esc(v.uploader_email || "")}) · ${esc(v.created_at || "")}</small></div>
        <div class="row-actions">
          <a class="btn" href="watch.html?v=${v.id}&at=${encodeURIComponent(token)}" target="_blank">Preview</a>
          <button class="btn primary" data-approve="${v.id}">Approve</button>
          <button class="btn danger" data-reject="${v.id}">Reject</button>
        </div></div>`;
    });
    html += `<div class="section-title" style="margin-top:18px">📡 In-flight uploads (${d.sending.length})</div>`;
    if (!d.sending.length) html += '<p style="color:var(--muted)">Nothing in flight.</p>';
    d.sending.forEach(p => {
      html += `<div class="admin-row">
        <div class="grow"><b>${esc(p.title)}</b>
        <small>by ${esc(p.uploader)} · ${esc(p.status)}${p.error ? " · " + esc(p.error) : ""}</small></div>
        <div class="row-actions">
          ${p.status === "failed" ? `<button class="btn danger" data-discard="${p.id}">Discard</button>` : ""}
        </div></div>`;
    });
    pane.innerHTML = html;
    pane.querySelectorAll("[data-approve]").forEach(b => b.onclick = async () => {
      await aapi("/api/admin/videos/bulk", { method: "POST", body: JSON.stringify({ ids: [+b.dataset.approve], action: "publish" }) });
      paneReview(pane);
    });
    pane.querySelectorAll("[data-reject]").forEach(b => b.onclick = async () => {
      if (!confirm("Reject and delete this upload?")) return;
      await aapi("/api/admin/videos/" + b.dataset.reject, { method: "DELETE" });
      paneReview(pane);
    });
    pane.querySelectorAll("[data-discard]").forEach(b => b.onclick = async () => {
      await aapi("/api/admin/uploads/" + b.dataset.discard, { method: "DELETE" });
      paneReview(pane);
    });
  } catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}

/* ---------------- Videos ---------------- */
let vsel = new Set(), vq = "", vsort = "new";
async function paneVideos(pane) {
  pane.innerHTML = `
    <div style="display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap">
      <button class="btn primary" id="syncBtn">🔄 Sync channel now</button>
      <input id="mq" type="search" placeholder="Search videos…" value="${esc(vq)}" style="flex:1;min-width:140px">
      <select id="vsort">
        <option value="new"${vsort==="new"?" selected":""}>Newest</option>
        <option value="popular"${vsort==="popular"?" selected":""}>Most viewed</option>
        <option value="trending"${vsort==="trending"?" selected":""}>Trending 7d</option>
      </select>
    </div>
    <div class="bulkbar" id="bulkbar" style="display:none">
      <b id="selCount">0 selected</b>
      <button class="btn sm" data-b="publish">Publish</button>
      <button class="btn sm" data-b="unpublish">Unpublish</button>
      <button class="btn sm danger" data-b="delete">Delete</button>
      <button class="btn sm" id="selClear">Clear</button>
    </div>
    <div id="vlist"></div>`;
  $("#syncBtn").onclick = async () => {
    $("#syncBtn").disabled = true; $("#syncBtn").textContent = "Syncing…";
    try { const r = await aapi("/api/admin/sync", { method: "POST", body: "{}" }); alert(`Sync done: ${r.added} new, ${r.skipped} already listed.`); }
    catch (e) { alert(e.message); }
    $("#syncBtn").disabled = false; $("#syncBtn").textContent = "🔄 Sync channel now";
    loadVideos();
  };
  let deb;
  $("#mq").addEventListener("input", e => { clearTimeout(deb); deb = setTimeout(() => { vq = e.target.value; loadVideos(); }, 400); });
  $("#vsort").onchange = e => { vsort = e.target.value; loadVideos(); };
  $("#selClear").onclick = () => { vsel.clear(); loadVideos(); };
  pane.querySelectorAll("[data-b]").forEach(b => b.onclick = () => bulk(b.dataset.b));
  loadVideos();
}
async function bulk(action) {
  if (!vsel.size) return;
  if (action === "delete" && !confirm(`Delete ${vsel.size} video(s) from the website?\n\nFiles in Telegram stay untouched.`)) return;
  await aapi("/api/admin/videos/bulk", { method: "POST", body: JSON.stringify({ ids: [...vsel], action }) });
  vsel.clear(); loadVideos();
}
async function loadVideos() {
  const box = $("#vlist"); if (!box) return;
  box.innerHTML = "<p>Loading…</p>";
  const qs = `?q=${encodeURIComponent(vq)}&sort=${vsort}`;
  let items;
  try { items = await aapi("/api/admin/videos" + qs); }
  catch (e) { box.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  if (!items.length) { box.innerHTML = '<p style="color:var(--muted)">No videos. Press “Sync channel now” after linking the channel.</p>'; return; }
  const bb = $("#bulkbar");
  bb.style.display = vsel.size ? "flex" : "none";
  const sc = $("#selCount"); if (sc) sc.textContent = `${vsel.size} selected`;
  box.innerHTML = "";
  const tbl = document.createElement("table");
  tbl.className = "tbl vtbl";
  tbl.innerHTML = `<colgroup><col style="width:32px"><col style="width:100px"><col><col style="width:80px"><col style="width:136px"><col style="width:96px"><col style="width:230px"></colgroup><tr><th><input type="checkbox" id="selAll"></th><th></th><th>Title</th><th>Length</th><th>Views</th><th>Status</th><th></th></tr>`;
  items.forEach(v => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="checkbox" data-id="${v.id}"${vsel.has(v.id) ? " checked" : ""}></td>
      <td>${v.thumb_url ? `<img src="${esc(v.thumb_url)}" class="thumb-sm" loading="lazy">` : `<div class="thumb-sm"></div>`}</td>
      <td><div class="vtitle" title="${esc(v.title)}">${esc(v.title)}</div><div class="vmeta">${esc(v.category || "Uncategorized")} · ${fmtSize(v.file_size)}</div></td>
      <td><span class="dchip">${v.duration ? fmtDur(v.duration) : "—"}</span></td>
      <td><div class="num">${fmtViews(v.view_count)}</div><div class="vmeta">${v.like_count || 0} likes · ${v.comment_count || 0} comments</div></td>
      <td><span class="pill ${v.visibility === "published" ? "pub" : "unpub"}">${v.visibility}</span><br><small style="color:var(--muted)">${v.status}</small></td>
      <td style="white-space:nowrap">
        <button class="btn sm" data-act="toggle">${v.visibility === "published" ? "Unpublish" : "Publish"}</button>
        <button class="btn sm ic" data-act="feat" title="Feature on homepage">${v.featured ? "⭐" : "☆"}</button>
        <button class="btn sm ic" data-act="stats" title="Statistics">📊</button>
        <button class="btn sm" data-act="edit">Edit</button>
        <button class="btn sm ic danger" data-act="del" title="Delete">✕</button>
      </td>`;
    tr.querySelector("[data-id]").onchange = e => { e.target.checked ? vsel.add(v.id) : vsel.delete(v.id); loadVideos(); };
    const acts = tr.querySelectorAll("[data-act]");
    acts[0].onclick = async () => { await aapi(`/api/admin/videos/${v.id}`, { method: "PATCH", body: JSON.stringify({ visibility: v.visibility === "published" ? "unpublished" : "published" }) }); loadVideos(); };
    acts[1].onclick = async () => { await aapi(`/api/admin/videos/${v.id}`, { method: "PATCH", body: JSON.stringify({ featured: !v.featured }) }); loadVideos(); };
    acts[2].onclick = () => openStats(v);
    acts[3].onclick = () => openEdit(v);
    acts[4].onclick = async () => { if (!confirm(`Remove "${v.title}" from the website?\n\nThe file in your Telegram channel stays untouched.`)) return; await aapi(`/api/admin/videos/${v.id}`, { method: "DELETE" }); loadVideos(); };
    tbl.appendChild(tr);
  });
  box.appendChild(tbl);
  const sa = $("#selAll");
  if (sa) sa.onchange = e => { items.forEach(v => e.target.checked ? vsel.add(v.id) : vsel.delete(v.id)); loadVideos(); };
}

/* ---------------- Comments ---------------- */
async function paneComments(pane) {
  pane.innerHTML = "<p>Loading…</p>";

    ${d.items.map(c => `<div class="kv"><span><b>${esc(c.user_name)}</b> on <i>${esc(c.video_title)}</i><br>${esc(c.body)}<br><small>${esc((c.created_at || "").slice(0, 16).replace("T", " "))}</small></span>

/* ---------------- Users ---------------- */
async function paneUsers(pane) {
  pane.innerHTML = "<p>Loading…</p>";
  let d;
  try { d = await aapi("/api/admin/users?per_page=50"); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  pane.innerHTML = `<div class="panel"><h3>👥 Users (${d.total})</h3><div style="overflow-x:auto"><table class="tbl">
    <tr><th>User</th><th>Joined</th><th>📤</th><th>❤️</th><th>💬</th><th>Role</th><th>Status</th><th>Actions</th></tr>
    ${d.items.map(u => `<tr>
      <td><b>${esc(u.name)}</b><br><small style="color:var(--muted)">${esc(u.email)}</small></td>
      <td>${esc((u.created_at || "").slice(0, 10))}</td><td>${u.uploads}</td><td>${u.likes}</td><td>${u.comments}</td>
      <td>${u.role === "admin" ? "👑 admin" : "user"}</td>
      <td>${u.banned ? '<span style="color:var(--danger)">🚫 banned</span>' : '<span style="color:var(--ok)">active</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn" data-ban="${u.id}" data-cur="${u.banned ? 1 : 0}" style="padding:5px 10px;font-size:12px">${u.banned ? "Unban" : "Ban"}</button>
        <button class="btn" data-role="${u.id}" data-cur="${u.role}" style="padding:5px 10px;font-size:12px">${u.role === "admin" ? "Make user" : "Make admin"}</button>
        <button class="btn" data-pw="${u.id}" style="padding:5px 10px;font-size:12px">Reset PW</button>
      </td></tr>`).join("")}
    </table></div></div>`;
  pane.querySelectorAll("[data-ban]").forEach(b => b.onclick = async () => {
    const banned = b.dataset.cur !== "1";
    if (banned && !confirm("Ban this user? They will not be able to log in, upload or comment.")) return;
    await aapi("/api/admin/users/" + b.dataset.ban, { method: "PATCH", body: JSON.stringify({ banned }) });
    paneUsers(pane);
  });
  pane.querySelectorAll("[data-role]").forEach(b => b.onclick = async () => {
    const role = b.dataset.cur === "admin" ? "user" : "admin";
    await aapi("/api/admin/users/" + b.dataset.role, { method: "PATCH", body: JSON.stringify({ role }) });
    paneUsers(pane);
  });
  pane.querySelectorAll("[data-pw]").forEach(b => b.onclick = async () => {
    const pw = prompt("New password for this user (6+ characters):");
    if (!pw) return;
    try { await aapi("/api/admin/users/" + b.dataset.pw, { method: "PATCH", body: JSON.stringify({ password: pw }) }); alert("Password reset done."); }
    catch (e) { alert(e.message); }
  });
}

/* ---------------- Categories ---------------- */
async function paneCats(pane) {
  pane.innerHTML = "<p>Loading…</p>";
  let cats;
  try { cats = await (await fetch(API + "/api/categories")).json(); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  pane.innerHTML = `
    <div class="panel"><h3>🗂️ Categories (${cats.length})</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="catName" placeholder="New category name…" style="flex:1">
        <button class="btn primary" id="catAdd">+ Add</button>
      </div>
      ${cats.map(c => `<div class="admin-row">
        <div class="grow"><b>${esc(c.name)}</b> <small>· ${c.count} video(s) · /${esc(c.slug)}</small></div>
        <div class="row-actions">
          <button class="btn" data-ren="${c.id}" data-cur="${esc(c.name)}">Rename</button>
          ${c.slug !== "uncategorized" ? `<button class="btn danger" data-delcat="${c.id}">Delete</button>` : ""}
        </div></div>`).join("")}
      <p style="color:var(--muted);font-size:12px">Deleting a category moves its videos to Uncategorized.</p>
    </div>`;
  $("#catAdd").onclick = async () => {
    const name = $("#catName").value.trim(); if (!name) return;
    try { await aapi("/api/admin/categories", { method: "POST", body: JSON.stringify({ name }) }); paneCats(pane); }
    catch (e) { alert(e.message); }
  };
  pane.querySelectorAll("[data-ren]").forEach(b => b.onclick = async () => {
    const name = prompt("New name:", b.dataset.cur); if (!name || name === b.dataset.cur) return;
    try { await aapi("/api/admin/categories/" + b.dataset.ren, { method: "PATCH", body: JSON.stringify({ name }) }); paneCats(pane); }
    catch (e) { alert(e.message); }
  });
  pane.querySelectorAll("[data-delcat]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this category? Its videos move to Uncategorized.")) return;
    try { await aapi("/api/admin/categories/" + b.dataset.delcat, { method: "DELETE" }); paneCats(pane); }
    catch (e) { alert(e.message); }
  });
}

/* ---------------- System ---------------- */
async function paneSystem(pane) {
  pane.innerHTML = "<p>Loading…</p>";
  let sys, tg;
  try { sys = await aapi("/api/admin/system"); tg = await aapi("/api/admin/status"); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  pane.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b>${tg.connected ? "🟢" : "🔴"}</b><span>Telegram ${tg.connected ? "connected" : "offline"}</span></div>
      <div class="stat"><b>${sys.db_size_mb} MB</b><span>🗄️ Database size</span></div>
      <div class="stat"><b>${sys.disk_free_gb} GB</b><span>💾 Disk free of ${sys.disk_total_gb} GB</span></div>
      <div class="stat"><b>${sys.pending_review}</b><span>📥 Pending review</span></div>
      <div class="stat"><b>${sys.open_reports}</b><span>🚩 Open reports</span></div>
    </div>
    <div class="panel"><h3>💾 Backup & export</h3>
      <p style="color:var(--muted);font-size:13px">Download a full copy of the site database, or export lists as CSV (opens in Excel/Sheets).</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="dlBackup">⬇️ Download DB backup</button>
        <button class="btn" id="dlUsers">⬇️ Users CSV</button>
        <button class="btn" id="dlVideos">⬇️ Videos CSV</button>
      </div>
    </div>
    <div class="panel"><h3>ℹ️ About</h3>
      <div class="kv"><span>Version</span><b>StreamHub v9 · Super Admin</b></div>
      <div class="kv"><span>Telegram account</span><small>${esc(tg.account || "—")}</small></div>
      <div class="kv"><span>Channel</span><small>${tg.channel_id ? "linked" : "not set"}</small></div>
    </div>`;
  const dl = async (path, fname) => {
    const res = await fetch(API + path, { headers: { "X-Admin-Token": token } });
    if (!res.ok) { alert("Download failed"); return; }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $("#dlBackup").onclick = () => dl("/api/admin/backup", "streamhub-backup.db");
  $("#dlUsers").onclick = () => dl("/api/admin/export/users", "users.csv");
  $("#dlVideos").onclick = () => dl("/api/admin/export/videos", "videos.csv");
}

      <div class="field"><label>Site name</label>

/* ---------------- Setup (Telegram/channel) ---------------- */
async function paneSetup(pane) {
  let st;
  try { st = await aapi("/api/admin/status"); }
  catch (e) { pane.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  pane.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b>${st.connected ? "🟢" : "🔴"}</b><span>Telegram ${st.configured ? (st.connected ? "connected (" + esc(st.account || "") + ")" : "not connected") : "not configured"}</span></div>
      <div class="stat"><b>${st.channel_id ? "📺" : "—"}</b><span>${st.channel_id ? "Channel linked" : "Channel not set"}</span></div>
      <div class="stat"><b>${st.videos_published}</b><span>Videos published</span></div>
      <div class="stat"><b>${st.users_total}</b><span>Registered users</span></div>
    </div>
    <div id="setup"></div>
    ${st.last_sync ? `<p style="color:var(--muted);font-size:12px">Last sync: ${esc(st.last_sync)}</p>` : ""}
    ${st.last_error ? `<p class="error">Last sync note: ${esc(st.last_error)}</p>` : ""}`;
  const setup = pane.querySelector("#setup");
  if (!st.configured || !st.connected || !st.channel_id) {
    setup.innerHTML = `
      <div class="step ${st.configured ? "done" : ""}" id="s1">
        <h3>Step 1 — Telegram API credentials</h3>
        <p>Get <b>api_id</b> and <b>api_hash</b> once from <b>my.telegram.org</b> (login → API development tools → create app). They stay on the server only.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="inApiId" placeholder="api_id" inputmode="numeric" style="flex:1;min-width:120px;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <input id="inApiHash" placeholder="api_hash" style="flex:2;min-width:160px;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <button class="btn primary" id="bSaveTg">Save</button>
        </div><div class="error" id="e1"></div>
      </div>
      <div class="step" id="s2">
        <h3>Step 2 — Log in the Telegram account</h3>
        <p>Use your <b>secondary</b> Telegram account (never the main one). Enter phone with country code, then the code Telegram sends to that account's app.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="inPhone" placeholder="+91…" style="flex:1;min-width:140px;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <button class="btn" id="bSendCode">Send code</button>
          <input id="inCode" placeholder="code" inputmode="numeric" style="flex:1;min-width:100px;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <input id="inPass" placeholder="2FA password (if any)" type="password" style="flex:1;min-width:140px;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <button class="btn primary" id="bVerify">Verify</button>
        </div><div class="error" id="e2"></div><div class="ok" id="o2"></div>
      </div>
      <div class="step" id="s3">
        <h3>Step 3 — Link the private channel</h3>
        <p>Create a <b>private</b> channel in the secondary account's Telegram app. <b>Everything you put in that channel becomes public on the website</b> — keep it dedicated. Then paste its username (e.g. @mychannel), invite link, or numeric ID.</p>
        <div style="display:flex;gap:8px">
          <input id="inChannel" placeholder="@mychannel or invite link" style="flex:1;background:var(--bg);border:1px solid #2a2a38;color:var(--text);border-radius:10px;padding:10px">
          <button class="btn primary" id="bChannel">Link</button>
        </div><div class="error" id="e3"></div>
      </div>`;
    $("#bSaveTg").onclick = async () => {
      try { await aapi("/api/admin/tg-config", { method: "POST", body: JSON.stringify({ api_id: $("#inApiId").value, api_hash: $("#inApiHash").value }) }); paneSetup(pane); }
      catch (e) { $("#e1").textContent = e.message; }
    };
    $("#bSendCode").onclick = async () => {
      try { await aapi("/api/admin/tg-send-code", { method: "POST", body: JSON.stringify({ phone: $("#inPhone").value }) }); $("#o2").textContent = "Code sent — check the Telegram app on that account."; $("#e2").textContent = ""; }
      catch (e) { $("#e2").textContent = e.message; }
    };
    $("#bVerify").onclick = async () => {
      try {
        const r = await aapi("/api/admin/tg-verify", { method: "POST", body: JSON.stringify({ code: $("#inCode").value, password: $("#inPass").value }) });
        if (r.need_password) { $("#e2").textContent = "This account has 2FA — enter the password and press Verify again."; return; }
        $("#o2").textContent = "Logged in as " + r.account + ". Now link the channel below."; $("#e2").textContent = "";
        paneSetup(pane);
      } catch (e) { $("#e2").textContent = e.message; }
    };
    $("#bChannel").onclick = async () => {
      try { const r = await aapi("/api/admin/channel", { method: "POST", body: JSON.stringify({ channel: $("#inChannel").value }) }); alert("Channel linked: " + (r.title || r.channel_id)); paneSetup(pane); }
      catch (e) { $("#e3").textContent = e.message; }
    };
  } else {
    setup.innerHTML = `<div class="panel"><h3>✅ All connected</h3>
      <div class="kv"><span>Telegram account</span><b>${esc(st.account || "")}</b></div>
      <div class="kv"><span>Channel</span><b>${esc(st.channel_id || "")}</b></div>
      <div style="margin-top:10px"><button class="btn primary" id="syncBtn2">🔄 Sync channel now</button></div></div>`;
    $("#syncBtn2").onclick = async () => {
      try { const r = await aapi("/api/admin/sync", { method: "POST", body: "{}" }); alert(`Sync done: ${r.added} new, ${r.skipped} already listed.`); paneSetup(pane); }
      catch (e) { alert(e.message); }
    };
  }
}

/* ---------------- edit dialog ---------------- */
let editingId = null;
async function openStats(v) {
  const dlg = $("#statsDlg");
  dlg.innerHTML = `<h3 style="margin:0 0 10px">📊 ${esc(v.title)}</h3><p style="color:var(--muted)">Loading…</p>`;
  dlg.showModal();
  try {
    const st = await aapi(`/api/admin/videos/${v.id}/stats`);
    const mx = Math.max(...st.views_by_day.map(d => d.views), 1);
    const bars = st.views_by_day.map(d =>
      `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px" title="${d.date}: ${d.views} views">
        <div style="width:100%;max-width:26px;height:${Math.max(3, Math.round(d.views / mx * 90))}px;background:linear-gradient(180deg,#ff4a52,#d9232e);border-radius:5px"></div>
        <small style="font-size:9px;color:var(--muted)">${d.date.slice(5)}</small></div>`).join("");
    dlg.innerHTML = `
      <h3 style="margin:0 0 12px">📊 ${esc(v.title)}</h3>
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><b>${fmtViews(st.video.view_count)}</b><span>👁️ Total views</span></div>
        <div class="stat"><b>${st.likes}</b><span>❤️ Likes</span></div>
        <div class="stat"><b>${st.comments}</b><span>💬 Comments</span></div>
        <div class="stat"><b>${st.in_playlists}</b><span>📂 In playlists</span></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin:6px 0 4px">Views — last 14 days</p>
      <div style="display:flex;gap:3px;align-items:flex-end;height:120px">${bars}</div>
      <div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="document.getElementById('statsDlg').close()">Close</button></div>`;
  } catch (e) {
    dlg.innerHTML = `<p class="error">${esc(e.message)}</p><button class="btn" onclick="document.getElementById('statsDlg').close()">Close</button>`;
  }
}
function openEdit(v) {
  editingId = v.id;
  $("#eTitle").value = v.title;
  $("#eDesc").value = v.description || "";
  $("#eCat").value = v.category || "";
  $("#editDlg").showModal();
}
$("#eCancel").onclick = () => $("#editDlg").close();
$("#eSave").onclick = async () => {
  await aapi(`/api/admin/videos/${editingId}`, { method: "PATCH", body: JSON.stringify({
    title: $("#eTitle").value, description: $("#eDesc").value, category: $("#eCat").value }) });
  $("#editDlg").close();
  if (tab === "videos") paneVideos($("#pane"));
};
</script>
